[package]
name = "piim-common"
version = "0.3.1"
edition = "2024"

[dependencies]
hex = "0.4"
sha2 = "0.11"
anyhow = "1.0"
kameo = "0.22"
serde_json = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
