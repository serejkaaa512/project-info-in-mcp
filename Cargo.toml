[workspace]
resolver = "3"
members = ["crates/common", "crates/lancedb", "crates/qdrant", "crates/fastembed"]

[package]
name = "piim"
version = "0.3.1"
edition = "2024"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
rust-mcp-sdk = { version = "2.0", features = ["stdio", "server"] }
cfg-if = "1.0.5"
kameo = "0.22"
dirs = { version = "7", optional = true }

piim-qdrant = { path = "crates/qdrant", optional = true }
piim-lance = { path = "crates/lancedb", optional = true }
piim-fastembed = { path = "crates/fastembed", optional = true }
piim-common = { path = "crates/common" }

[features]
default = ["lance_store"]
qdrant_store = ["dep:piim-qdrant"]
lance_store = ["dep:piim-lance"]
fastembed = ["dep:piim-fastembed", "dep:dirs"]
